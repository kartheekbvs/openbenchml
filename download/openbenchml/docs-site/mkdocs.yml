site_name: OpenBenchML Documentation
site_description: Open-source ML model benchmarking platform with Kaggle-style competitions, real percentile latency metrics, and a CLI.
site_url: https://kartheekbvs.github.io/openbenchml/
repo_url: https://github.com/kartheekbvs/openbenchml
repo_name: kartheekbvs/openbenchml
edit_uri: edit/main/docs-site/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  language: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Concepts: getting-started/concepts.md
  - User Guide:
      - Models: user-guide/models.md
      - Datasets: user-guide/datasets.md
      - Benchmarks: user-guide/benchmarks.md
      - Leaderboard: user-guide/leaderboard.md
      - Competitions: user-guide/competitions.md
      - Discussions: user-guide/discussions.md
  - CLI Reference:
      - Overview: cli/index.md
      - Commands: cli/commands.md
  - API Reference:
      - Overview: api/index.md
      - Auth: api/auth.md
      - Models: api/models.md
      - Benchmarks: api/benchmarks.md
      - Leaderboard: api/leaderboard.md
      - Competitions: api/competitions.md
      - Notifications: api/notifications.md
  - Architecture:
      - Overview: architecture/overview.md
      - Database Schema: architecture/database.md
      - Benchmark Engine: architecture/engine.md
      - Real-time (WebSocket): architecture/websocket.md
  - Deployment:
      - Local: deployment/local.md
      - Docker: deployment/docker.md
      - Cloud: deployment/cloud.md
  - Contributing: contributing.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartheekbvs/openbenchml
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/openbenchml-cli
  generator: false

extra_css:
  - assets/custom.css

copyright: Open source under the MIT License.
