<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — OpenBenchML</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 3rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.6rem; color: #1a1a1a; }
    p { color: #555; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #a0c000;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }
    .btn:hover { background: #8aab00; }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128268;</div>
    <h1>You're offline</h1>
    <p>We couldn't reach the OpenBenchML server. This might be a network
    issue on your end, or the server is restarting.</p>
    <button class="btn" onclick="location.reload()">Try Again</button>
    <div class="hint">
      Cached pages may still be available — try navigating back.
      The server usually restarts in 30-60 seconds.
    </div>
  </div>
  <script>
    // Auto-retry every 10 seconds until the server comes back
    setInterval(async () => {
      try {
        const r = await fetch('/keepalive', { cache: 'no-store' });
        if (r.ok) {
          location.reload();
        }
      } catch (e) { /* still offline */ }
    }, 10000);
  </script>
</body>
</html>
